<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – Al Noor</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0F1923;
      font-family: 'Inter', sans-serif;
      padding: 1rem;
    }

    .bg-pattern {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(201,168,76,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 90%, rgba(62,207,142,0.06) 0%, transparent 60%);
    }

    .card {
      position: relative; z-index: 1;
      background: #162130;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    }

    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #C9A84C, #E8C96B);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      margin-bottom: 0.75rem;
      box-shadow: 0 8px 24px rgba(201,168,76,0.3);
    }

    .logo h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #F1F5F9;
      letter-spacing: -0.02em;
    }

    .logo p {
      font-size: 0.8rem;
      color: #64748B;
      margin-top: 0.2rem;
    }

    .form-group {
      margin-bottom: 1.1rem;
    }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.45rem;
    }

    input {
      width: 100%;
      background: #1D2D3E;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      font-family: inherit;
      color: #F1F5F9;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #C9A84C;
      box-shadow: 0 0 0 3px rgba(201,168,76,0.15);
    }

    input::placeholder { color: #475569; }

    .btn {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.85rem;
      background: linear-gradient(135deg, #C9A84C, #E8C96B);
      color: #0F1923;
      font-weight: 700;
      font-size: 0.95rem;
      font-family: inherit;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .error {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.25);
      border-radius: 8px;
      color: #F87171;
      font-size: 0.85rem;
      text-align: center;
      display: none;
    }

    .error.show { display: block; }

    .divider {
      text-align: center;
      margin: 1.5rem 0 0;
      font-size: 0.78rem;
      color: #475569;
    }

    .divider a {
      color: #C9A84C;
      text-decoration: none;
      font-weight: 500;
    }

    .divider a:hover { text-decoration: underline; }

    .shake {
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
  </style>
</head>
<body>
  <div class="bg-pattern"></div>
  <div class="card" id="card">
    <div class="logo">
      <div class="logo-icon">☪</div>
      <h1>Al Noor – Admin</h1>
      <p>Beveiligd dashboard</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Gebruikersnaam</label>
        <input type="text" id="username" placeholder="admin" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Wachtwoord</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn" id="btn">Inloggen</button>
      <div class="error" id="error">Ongeldige gebruikersnaam of wachtwoord.</div>
    </form>

    <p class="divider"><a href="/survey.html">← Terug naar de bevraging</a></p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const errorEl = document.getElementById('error');
      const card = document.getElementById('card');

      btn.disabled = true;
      btn.textContent = 'Bezig...';
      errorEl.classList.remove('show');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (res.ok) {
          btn.textContent = '✓ Ingelogd!';
          setTimeout(() => { window.location.href = '/results.html'; }, 500);
        } else {
          card.classList.add('shake');
          setTimeout(() => card.classList.remove('shake'), 400);
          errorEl.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Inloggen';
          document.getElementById('password').value = '';
        }
      } catch {
        errorEl.textContent = 'Verbindingsfout. Probeer opnieuw.';
        errorEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Inloggen';
      }
    });
  </script>
</body>
</html>
