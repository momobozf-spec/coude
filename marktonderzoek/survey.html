<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marktbevraging – Islamitische Webshop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- AOS – scroll animaties -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
  <!-- SweetAlert2 – mooie dialogen -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <!-- Tippy.js – tooltips -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tippy.js@6/dist/tippy.css">
  <style>
    :root {
      --navy:   #0D1B2A;
      --green:  #1A3A2A;
      --green2: #2A5C42;
      --gold:   #C9A84C;
      --gold2:  #E8C96B;
      --white:  #FFFFFF;
      --off:    #F7F6F2;
      --muted:  #6B7280;
      --border: #E5E7EB;
      --text:   #111827;
      --red:    #B91C1C;
      --radius: 16px;
      --shadow: 0 4px 24px rgba(0,0,0,0.07);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--off); color: var(--text); min-height: 100vh; line-height: 1.6; }

    /* TOP BAR */
    .topbar { background: var(--navy); display: flex; align-items: center; justify-content: space-between; padding: 12px 32px; }
    .topbar-logo { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.1rem; letter-spacing: 0.5px; }
    .lang-group { display: flex; gap: 6px; }
    .lang-btn {
      background: transparent; color: rgba(255,255,255,0.5);
      border: 1px solid rgba(255,255,255,0.15); border-radius: 6px;
      padding: 5px 14px; font-size: 0.75rem; font-weight: 600;
      cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s; letter-spacing: 0.5px;
    }
    .lang-btn:hover { color: white; border-color: rgba(255,255,255,0.4); }
    .lang-btn.active { background: var(--gold); color: var(--navy); border-color: var(--gold); }

    /* HERO */
    .hero {
      background: linear-gradient(160deg, var(--navy) 0%, var(--green) 55%, var(--green2) 100%);
      color: white; text-align: center; padding: 60px 24px 52px; position: relative; overflow: hidden;
    }
    .hero::before {
      content: ''; position: absolute; inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .hero-inner { position: relative; z-index: 1; }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(201,168,76,0.15); border: 1px solid rgba(201,168,76,0.35);
      color: var(--gold2); border-radius: 99px;
      padding: 5px 18px; font-size: 0.75rem; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 20px;
    }
    .hero h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.6rem, 5vw, 2.6rem); font-weight: 700; line-height: 1.25; margin-bottom: 16px; }
    .hero p { font-size: 0.95rem; color: rgba(255,255,255,0.72); max-width: 560px; margin: 0 auto 36px; line-height: 1.8; font-weight: 300; }

    .progress-container { max-width: 500px; margin: 0 auto; background: rgba(255,255,255,0.08); border-radius: var(--radius); padding: 16px 24px; border: 1px solid rgba(255,255,255,0.1); }
    .progress-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .progress-text { font-size: 0.78rem; color: rgba(255,255,255,0.55); font-weight: 500; }
    .progress-pct { font-size: 0.88rem; color: var(--gold2); font-weight: 700; }
    .progress-track { background: rgba(255,255,255,0.1); border-radius: 99px; height: 6px; }
    .progress-fill { background: linear-gradient(90deg, var(--gold), var(--gold2)); height: 6px; border-radius: 99px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1); width: 0%; }

    /* FORM */
    .form-wrap { max-width: 740px; margin: 0 auto; padding: 40px 20px 80px; }

    .sec-header { display: flex; align-items: center; gap: 14px; margin: 40px 0 18px; }
    .sec-header:first-child { margin-top: 0; }
    .sec-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--green); display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
    .sec-info { flex: 1; }
    .sec-title { font-size: 0.7rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--green2); }
    .sec-line { height: 1px; background: var(--border); margin-top: 4px; }

    /* CARDS */
    .q-card {
      background: var(--white); border-radius: var(--radius); border: 1.5px solid var(--border);
      box-shadow: var(--shadow); padding: 26px 28px 22px; margin-bottom: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .q-card:hover { box-shadow: 0 6px 32px rgba(0,0,0,0.1); }
    .q-card.has-error { border-color: var(--red); box-shadow: 0 0 0 3px rgba(185,28,28,0.08); }
    .q-header { display: flex; gap: 14px; margin-bottom: 18px; align-items: flex-start; }
    .q-num { width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0; background: var(--green); color: var(--gold2); font-size: 0.72rem; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
    .q-text { font-size: 0.97rem; font-weight: 600; line-height: 1.5; }
    .req { color: var(--red); margin-left: 2px; font-weight: 400; }
    .q-hint { font-size: 0.78rem; color: var(--muted); font-weight: 400; margin-top: 3px; }
    .error-msg { font-size: 0.77rem; color: var(--red); font-weight: 500; display: flex; align-items: center; gap: 5px; margin-top: 10px; }
    .error-msg::before { content: '⚠'; font-size: 0.85rem; }
    .q-card:not(.has-error) .error-msg { display: none !important; }
    .q-card.has-error .error-msg { display: flex !important; }

    /* OPTIONS */
    .options { display: flex; flex-direction: column; gap: 8px; }
    .opts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (max-width: 520px) { .opts-grid { grid-template-columns: 1fr; } }

    .opt {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 16px; border-radius: 12px; border: 1.5px solid var(--border);
      cursor: pointer; font-size: 0.9rem; color: #374151;
      transition: all 0.15s; user-select: none; position: relative; overflow: hidden;
    }
    .opt::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--gold); transform: scaleY(0); transition: transform 0.2s; border-radius: 3px 0 0 3px; }
    .opt:hover { border-color: #9CA3AF; background: #F9FAFB; }
    .opt.sel { border-color: var(--green2); background: #F0F7F3; color: var(--green); font-weight: 500; }
    .opt.sel::before { transform: scaleY(1); }
    .opt-dot { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; border: 2px solid #D1D5DB; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .opt.is-check .opt-dot { border-radius: 6px; }
    .opt.sel .opt-dot { border-color: var(--green2); background: var(--green2); }
    .opt.sel .opt-dot::after { content: '✓'; color: white; font-size: 0.65rem; font-weight: 800; }

    /* MATRIX */
    .scale-legend { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--muted); font-weight: 500; padding: 0 2px 12px; }
    .matrix-scroll { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); }
    .matrix-table { width: 100%; border-collapse: collapse; min-width: 500px; }
    .matrix-table thead tr { background: #F9FAFB; }
    .matrix-table th { font-size: 0.7rem; font-weight: 700; text-align: center; color: var(--muted); padding: 12px 8px; letter-spacing: 0.5px; text-transform: uppercase; border-bottom: 1.5px solid var(--border); }
    .matrix-table th:first-child { text-align: left; padding-left: 18px; width: 240px; }
    .matrix-table td { padding: 11px 8px; border-bottom: 1px solid #F3F4F6; vertical-align: middle; }
    .matrix-table td:first-child { font-size: 0.86rem; color: #374151; padding-left: 18px; font-weight: 500; }
    .matrix-table tbody tr:last-child td { border-bottom: none; }
    .matrix-table tbody tr:hover td { background: #FAFDF9; }
    .m-radio { display: flex; justify-content: center; }
    .m-radio input { display: none; }
    .m-radio label { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #D1D5DB; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .m-radio label:hover { border-color: var(--green2); background: #F0F7F3; }
    .m-radio input:checked + label { border-color: var(--green2); background: var(--green2); }
    .m-radio input:checked + label::after { content: '✓'; color: white; font-size: 0.65rem; font-weight: 800; }

    /* NPS */
    .nps-wrap { padding: 4px 0; }
    .nps-labels { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--muted); margin-bottom: 12px; }
    .nps-buttons { display: flex; gap: 5px; }
    .nps-btn {
      flex: 1; padding: 13px 2px; border: 1.5px solid var(--border); border-radius: 10px;
      background: white; cursor: pointer; text-align: center;
      font-size: 0.88rem; font-weight: 600; color: #6B7280;
      font-family: 'Inter', sans-serif; transition: all 0.15s;
    }
    .nps-btn:hover { border-color: #9CA3AF; background: #F9FAFB; }
    .nps-btn.sel-red   { border-color: #EF4444; background: #EF4444; color: white; }
    .nps-btn.sel-amber { border-color: #F59E0B; background: #F59E0B; color: white; }
    .nps-btn.sel-green { border-color: var(--green2); background: var(--green2); color: white; }
    .nps-groups { display: flex; gap: 4px; font-size: 0.7rem; color: var(--muted); margin-top: 8px; }
    .nps-group { flex: 1; text-align: center; padding: 3px 0; border-radius: 4px; }
    .nps-group.detractor { background: #FEF2F2; color: #EF4444; }
    .nps-group.passive   { background: #FFFBEB; color: #F59E0B; }
    .nps-group.promoter  { background: #F0FDF4; color: #16A34A; }

    /* OPEN TEXT */
    .open-field { width: 100%; padding: 14px 16px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 0.92rem; font-family: 'Inter', sans-serif; resize: vertical; min-height: 100px; color: var(--text); transition: border-color 0.2s, box-shadow 0.2s; line-height: 1.6; background: #FAFAFA; }
    .open-field:focus { outline: none; border-color: var(--green2); box-shadow: 0 0 0 3px rgba(42,92,66,0.1); background: white; }
    .email-field { width: 100%; padding: 13px 16px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 0.92rem; font-family: 'Inter', sans-serif; color: var(--text); transition: border-color 0.2s, box-shadow 0.2s; background: #FAFAFA; }
    .email-field:focus { outline: none; border-color: var(--green2); box-shadow: 0 0 0 3px rgba(42,92,66,0.1); background: white; }
    .opt-note { font-size: 0.75rem; color: var(--muted); margin-top: 8px; }

    /* SUBMIT */
    .submit-section { text-align: center; margin-top: 36px; padding: 32px; background: white; border-radius: var(--radius); border: 1.5px solid var(--border); box-shadow: var(--shadow); }
    .submit-note { font-size: 0.8rem; color: var(--muted); margin-bottom: 18px; }
    .btn-submit {
      background: linear-gradient(135deg, var(--green) 0%, var(--green2) 100%);
      color: white; border: none; padding: 16px 56px; border-radius: 12px;
      font-size: 1rem; font-weight: 600; font-family: 'Inter', sans-serif;
      cursor: pointer; box-shadow: 0 4px 20px rgba(26,58,42,0.35); transition: all 0.2s; letter-spacing: 0.3px;
    }
    .btn-submit::after { content: ' →'; transition: transform 0.2s; display: inline-block; }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(26,58,42,0.4); }
    .btn-submit:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }
    .btn-submit:disabled::after { content: ''; }

    /* THANK YOU */
    #thankyou { display: none; }
    .ty-wrap { text-align: center; padding: 80px 24px; max-width: 520px; margin: 0 auto; }
    .ty-icon-ring { width: 96px; height: 96px; border-radius: 50%; background: linear-gradient(135deg, var(--green), var(--green2)); display: flex; align-items: center; justify-content: center; margin: 0 auto 28px; font-size: 2.4rem; box-shadow: 0 8px 32px rgba(26,58,42,0.3); }
    .ty-brand { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--gold); letter-spacing: 1px; margin-bottom: 10px; }
    #thankyou h2 { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; margin-bottom: 14px; }
    #thankyou p { color: var(--muted); line-height: 1.8; margin-bottom: 32px; font-size: 0.95rem; }
    .btn-retry { background: var(--off); color: var(--green); border: 1.5px solid #D1D5DB; padding: 12px 28px; border-radius: 10px; font-size: 0.9rem; cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 600; transition: all 0.15s; }
    .btn-retry:hover { background: #F0F7F3; border-color: var(--green2); }

    @media (max-width: 600px) {
      .topbar { padding: 10px 16px; }
      .q-card { padding: 20px 16px 18px; }
      .hero { padding: 44px 16px 38px; }
      .submit-section { padding: 24px 20px; }
      .nps-buttons { flex-wrap: wrap; }
      .nps-btn { min-width: 28px; }
    }

    /* ── STICKY PROGRESS BAR ──────────────────────── */
    .sticky-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      background: var(--navy); padding: 8px 20px;
      display: flex; align-items: center; gap: 14px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.4);
      transform: translateY(-100%);
      transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    .sticky-bar.visible { transform: translateY(0); }
    .sticky-bar-label { font-size: 0.75rem; color: rgba(255,255,255,0.5); white-space: nowrap; }
    .sticky-bar-track { flex: 1; background: rgba(255,255,255,0.1); border-radius: 99px; height: 5px; }
    .sticky-bar-fill { background: linear-gradient(90deg, var(--gold), var(--gold2)); height: 5px; border-radius: 99px; transition: width 0.5s ease; width: 0%; }
    .sticky-bar-pct { font-size: 0.8rem; font-weight: 700; color: var(--gold2); white-space: nowrap; }

    /* ── AUTO-SAVE BANNER ─────────────────────────── */
    .restore-banner {
      background: linear-gradient(135deg, #1b4332, #2A5C42);
      color: white; padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      flex-wrap: wrap;
    }
    .restore-banner p { font-size: 0.85rem; opacity: 0.9; }
    .restore-banner p strong { font-weight: 600; }
    .restore-btns { display: flex; gap: 8px; }
    .restore-btn {
      padding: 6px 16px; border-radius: 8px; font-size: 0.78rem; font-weight: 600;
      cursor: pointer; border: none; font-family: 'Inter', sans-serif; transition: all 0.15s;
    }
    .restore-btn.yes { background: var(--gold); color: var(--navy); }
    .restore-btn.no  { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }

    /* ── TIPPY CUSTOMIZATION ──────────────────────── */
    .tippy-box[data-theme~='alnoor'] {
      background: var(--navy); color: rgba(255,255,255,0.9);
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 10px; font-size: 0.8rem; line-height: 1.6;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3); max-width: 260px;
    }
    .tippy-box[data-theme~='alnoor'] .tippy-arrow { color: var(--navy); }
    .tooltip-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; border-radius: 50%;
      background: rgba(201,168,76,0.15); border: 1px solid rgba(201,168,76,0.4);
      color: var(--gold); font-size: 0.65rem; font-weight: 700;
      cursor: help; margin-left: 8px; vertical-align: middle;
      transition: all 0.15s; flex-shrink: 0;
    }
    .tooltip-icon:hover { background: rgba(201,168,76,0.3); }

    /* ── SCROLL-TO-TOP ────────────────────────────── */
    .scroll-top {
      position: fixed; bottom: 28px; right: 24px;
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--green); color: white;
      border: none; font-size: 1.1rem; cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      transition: all 0.2s; opacity: 0; pointer-events: none;
      display: flex; align-items: center; justify-content: center;
    }
    .scroll-top.visible { opacity: 1; pointer-events: all; }
    .scroll-top:hover { background: var(--green2); transform: translateY(-2px); }

    /* ── AOS CUSTOM ───────────────────────────────── */
    [data-aos="fade-up"] { opacity: 0; transform: translateY(20px); }
    [data-aos="fade-up"].aos-animate { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

<!-- STICKY PROGRESS -->
<div class="sticky-bar" id="sticky-bar">
  <span class="sticky-bar-label" id="sticky-label">Al Noor ✦</span>
  <div class="sticky-bar-track"><div class="sticky-bar-fill" id="sticky-fill"></div></div>
  <span class="sticky-bar-pct" id="sticky-pct">0%</span>
</div>

<!-- RESTORE BANNER (hidden by default) -->
<div class="restore-banner" id="restore-banner" style="display:none">
  <p id="restore-msg"><strong>💾 Opgeslagen voortgang gevonden</strong> — Wilt u verdergaan waar u gebleven was?</p>
  <div class="restore-btns">
    <button class="restore-btn yes" onclick="restoreFromStorage()">Ja, doorgaan</button>
    <button class="restore-btn no" onclick="dismissRestore()">Nee, opnieuw starten</button>
  </div>
</div>

<div class="topbar">
  <div class="topbar-logo">Al Noor ✦</div>
  <div class="lang-group">
    <button class="lang-btn active" onclick="setLang('nl')">NL</button>
    <button class="lang-btn" onclick="setLang('fr')">FR</button>
    <button class="lang-btn" onclick="setLang('en')">EN</button>
  </div>
</div>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-badge" id="hero-badge">✦ Al Noor — Islamitische Webshop</div>
    <h1 id="hero-title"></h1>
    <p id="hero-desc"></p>
    <div class="progress-container">
      <div class="progress-top">
        <span class="progress-text" id="prog-label"></span>
        <span class="progress-pct" id="prog-pct">0%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="prog-fill"></div></div>
    </div>
  </div>
</div>

<!-- Plugins laden VOOR de main script -->
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tippy.js@6/dist/tippy.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

<button class="scroll-top" id="scroll-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Terug naar boven">↑</button>

<div class="form-wrap">
  <form id="survey" onsubmit="submitForm(event)" novalidate>
    <div id="form-content"></div>
    <div class="submit-section">
      <p class="submit-note" id="submit-note"></p>
      <button type="submit" class="btn-submit" id="submit-btn"></button>
    </div>
  </form>
  <div id="thankyou">
    <div class="ty-wrap">
      <div class="ty-icon-ring">✓</div>
      <div class="ty-brand">Al Noor ✦</div>
      <h2 id="ty-title"></h2>
      <p id="ty-desc"></p>
      <button class="btn-retry" onclick="location.reload()" id="ty-btn"></button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════
   TRANSLATIONS
═══════════════════════════════════════════════════ */
const T = {
  nl: {
    badge: '✦ Al Noor — Islamitische Webshop',
    hero_title: 'Marktbevraging',
    hero_desc: 'Beste deelnemer, bedankt voor uw deelname! Deze vragenlijst helpt ons uw voorkeuren en verwachtingen beter te begrijpen. Alle antwoorden zijn anoniem. Duur: ± 5 minuten.',
    progress: (n,t) => `${n} van ${t} verplichte vragen beantwoord`,
    submit_note: 'Controleer of alle verplichte velden (*) zijn ingevuld.',
    submit: 'Bevraging indienen',
    submitting: 'Indienen…',
    err_select: 'Gelieve een antwoord te selecteren.',
    err_check: 'Selecteer minstens één optie.',
    err_matrix: 'Beoordeel alle aspecten.',
    err_nps: 'Geef een score van 0 tot 10.',

function setLang(lang) {
  currentLang = lang; ans.lang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.textContent === lang.toUpperCase()));
  renderAll(); updateProgress();
}

function renderAll() {
  const t = T[currentLang];
  document.getElementById('hero-badge').textContent = t.badge;
  document.getElementById('hero-title').textContent = t.hero_title;
  document.getElementById('hero-desc').textContent = t.hero_desc;
  document.getElementById('submit-btn').textContent = t.submit;
  document.getElementById('submit-note').textContent = t.submit_note;
  document.getElementById('ty-title').textContent = t.ty_title;
  document.getElementById('ty-desc').textContent = t.ty_desc;
  document.getElementById('ty-btn').textContent = t.ty_btn;

  let html = ''; let lastSec = -1;
  QCONFIG.forEach((qc, i) => {
    const qi = t.questions[i];
    if (qc.section !== lastSec) {
      const s = t.sections[qc.section];
      html += `<div class="sec-header"><div class="sec-icon">${s.icon}</div><div class="sec-info"><div class="sec-title">${s.title}</div><div class="sec-line"></div></div></div>`;
      lastSec = qc.section;
    }
    html += buildCard(qc, qi, i + 1, t);
  });
  document.getElementById('form-content').innerHTML = html;
  restoreAnswers();
  buildMatrix(t);
  // Init Tippy tooltips after DOM update
  setTimeout(() => {
    if (typeof tippy !== 'undefined') {
      tippy('[data-tippy-content]', { theme: 'alnoor', placement: 'top', animation: 'scale', maxWidth: 280 });
    }
  }, 60);
}

function buildCard(qc, qi, num, t) {
  const req = qc.req ? '<span class="req">*</span>' : '';
  const hint = qi.hint ? `<div class="q-hint">${qi.hint}</div>` : '';
  let body = '';
  const errMsg = { check: t.err_check, matrix: t.err_matrix, nps: t.err_nps }[qc.type] || t.err_select;

  if ((qc.type === 'radio' || qc.type === 'check') && qi.opts) {
    const isCheck = qc.type === 'check';
    const fn = isCheck ? `toggleCheck('${qc.id}',this)` : `pickRadio('${qc.id}',this)`;
    const cls = `opt${isCheck ? ' is-check' : ''}`;
    const items = qi.opts.map(o =>
      `<label class="${cls}" data-val="${esc(o)}" onclick="${fn}"><div class="opt-dot"></div>${o}</label>`
    ).join('');
    body = qi.grid ? `<div class="opts-grid">${items}</div>` : `<div class="options">${items}</div>`;
  } else if (qc.type === 'matrix') {
    const scaleMin = { nl:'Helemaal niet belangrijk', fr:'Pas du tout important', en:'Not important at all' }[currentLang];
    const scaleMax = { nl:'Zeer belangrijk', fr:'Très important', en:'Very important' }[currentLang];
    body = `<div class="scale-legend"><span>${scaleMin}</span><span>${scaleMax}</span></div>
      <div class="matrix-scroll"><table class="matrix-table">
        <thead><tr><th></th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr></thead>
        <tbody id="matrix-body"></tbody>
      </table></div>`;
  } else if (qc.type === 'nps') {
    const btns = Array.from({length:11},(_,i)=>
      `<button type="button" class="nps-btn" data-val="${i}" onclick="pickNPS(${i},this)">${i}</button>`
    ).join('');
    body = `<div class="nps-wrap">
      <div class="nps-labels"><span>${t.nps_min}</span><span>${t.nps_max}</span></div>
      <div class="nps-buttons" id="nps-buttons">${btns}</div>
      <div class="nps-groups">
        <div class="nps-group detractor" style="flex:7">${t.nps_detractor}</div>
        <div class="nps-group passive" style="flex:2">${t.nps_passive}</div>
        <div class="nps-group promoter" style="flex:2">${t.nps_promoter}</div>
      </div>
    </div>`;
  } else if (qc.type === 'open') {
    body = `<textarea class="open-field" id="open-${qc.id}" oninput="ans.${qc.id}=this.value;updateProgress()"></textarea>`;
  } else if (qc.type === 'email') {
    body = `<input type="email" class="email-field" id="open-email" placeholder="email@voorbeeld.com" oninput="ans.email=this.value">
      <p class="opt-note">${t.req_note}</p>`;
  }

  const tip = TIPS[currentLang]?.[qc.id];
  const tipIcon = tip ? `<span class="tooltip-icon" data-tippy-content="${tip}" data-tippy-theme="alnoor">?</span>` : '';
  const delay = Math.min((num - 1) * 40, 300);
  return `<div class="q-card" id="card-${qc.id}" data-aos="fade-up" data-aos-delay="${delay}" data-aos-duration="400">
    <div class="q-header"><div class="q-num">${num}</div><div><div class="q-text">${qi.q}${req}${tipIcon}</div>${hint}</div></div>
    ${body}
    <div class="error-msg">${errMsg}</div>
  </div>`;
}

function buildMatrix(t) {
  const tbody = document.getElementById('matrix-body');
  if (!tbody) return;
  tbody.innerHTML = '';
  MATRIX_KEYS.forEach((key, i) => {
    const tr = document.createElement('tr');
    let c = `<td>${t.matrix_rows[i]}</td>`;
    for (let v = 1; v <= 5; v++) {
      c += `<td><div class="m-radio"><input type="radio" name="m_${key}" id="m_${key}_${v}" value="${v}" onchange="pickMatrix('${key}',${v})"><label for="m_${key}_${v}"></label></div></td>`;
    }
    tr.innerHTML = c; tbody.appendChild(tr);
  });
  MATRIX_KEYS.forEach(key => {
    if (ans.matrix[key]) { const el = document.getElementById(`m_${key}_${ans.matrix[key]}`); if (el) el.checked = true; }
  });
}

function restoreAnswers() {
  REQ_RADIO.concat(['religieuze_praktijk']).forEach(f => {
    if (!ans[f]) return;
    document.querySelectorAll(`#card-${f} .opt`).forEach(o => o.classList.toggle('sel', o.dataset.val === ans[f]));
  });
  REQ_CHECK.concat(['achtergrond','bekende_shops','belemmeringen']).forEach(f => {
    if (!ans[f]?.length) return;
    document.querySelectorAll(`#card-${f} .opt`).forEach(o => o.classList.toggle('sel', ans[f].includes(o.dataset.val)));
  });
  ['mist','uniek'].forEach(f => { const el = document.getElementById('open-'+f); if (el) el.value = ans[f]; });
  const em = document.getElementById('open-email'); if (em) em.value = ans.email;
  if (ans.nps !== null) {
    document.querySelectorAll('.nps-btn').forEach(b => {
      if (parseInt(b.dataset.val) === ans.nps) applyNPSClass(b, ans.nps);
    });
  }
}

function esc(s) { return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

/* ═══════════════════════════════════════════════════
   INTERACTION
═══════════════════════════════════════════════════ */
function pickRadio(field, el) {
  ans[field] = el.dataset.val;
  el.closest('.q-card').querySelectorAll('.opt').forEach(o => o.classList.remove('sel'));
  el.classList.add('sel');
  el.closest('.q-card').classList.remove('has-error');
  updateProgress();
}

function toggleCheck(field, el) {
  const v = el.dataset.val; const arr = ans[field];
  const idx = arr.indexOf(v);
  if (idx > -1) { arr.splice(idx,1); el.classList.remove('sel'); }
  else { arr.push(v); el.classList.add('sel'); }
  el.closest('.q-card').classList.remove('has-error');
  updateProgress();
}

function pickMatrix(key, val) {
  ans.matrix[key] = val;
  document.getElementById('card-matrix').classList.remove('has-error');
  updateProgress();
}

function applyNPSClass(btn, val) {
  btn.className = 'nps-btn';
  if (val <= 6) btn.classList.add('sel-red');
  else if (val <= 8) btn.classList.add('sel-amber');
  else btn.classList.add('sel-green');
}

function pickNPS(val, el) {
  ans.nps = val;
  document.querySelectorAll('.nps-btn').forEach(b => { b.className = 'nps-btn'; });
  applyNPSClass(el, val);
  document.getElementById('card-nps').classList.remove('has-error');
  updateProgress();
}

function countAnswered() {
  let n = 0;
  REQ_RADIO.forEach(f => { if (ans[f]) n++; });
  REQ_CHECK.forEach(f => { if (ans[f].length) n++; });
  if (MATRIX_KEYS.every(k => ans.matrix[k])) n++;
  if (ans.nps !== null) n++;
  return n;
}

function updateProgress() {
  const n = countAnswered(); const t = T[currentLang];
  const pct = Math.round(n / TOTAL_REQ * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = t.progress(n, TOTAL_REQ);
  document.getElementById('prog-pct').textContent = pct + '%';
}

/* ═══════════════════════════════════════════════════
   SUBMIT
═══════════════════════════════════════════════════ */
async function submitForm(e) {
  e.preventDefault();
  const t = T[currentLang]; let valid = true, firstErr = null;

  REQ_RADIO.forEach(f => {
    const card = document.getElementById('card-'+f); const ok = !!ans[f];
    card.classList.toggle('has-error', !ok); if (!ok) { valid = false; firstErr = firstErr || card; }
  });
  REQ_CHECK.forEach(f => {
    const card = document.getElementById('card-'+f); const ok = ans[f].length > 0;
    card.classList.toggle('has-error', !ok); if (!ok) { valid = false; firstErr = firstErr || card; }
  });
  const mCard = document.getElementById('card-matrix');
  const mOk = MATRIX_KEYS.every(k => ans.matrix[k]);
  mCard.classList.toggle('has-error', !mOk); if (!mOk) { valid = false; firstErr = firstErr || mCard; }

  const npsCard = document.getElementById('card-nps');
  npsCard.classList.toggle('has-error', ans.nps === null);
  if (ans.nps === null) { valid = false; firstErr = firstErr || npsCard; }

  if (!valid) {
    firstErr.scrollIntoView({ behavior: 'smooth', block: 'center' });
    Swal.fire({ icon: 'warning', title: { nl:'Niet volledig', fr:'Incomplet', en:'Incomplete' }[currentLang], text: { nl:'Vul alle verplichte velden in voordat u indient.', fr:'Veuillez remplir tous les champs obligatoires.', en:'Please fill in all required fields before submitting.' }[currentLang], confirmButtonColor: '#2A5C42', background: '#fff', color: '#111827' });
    return;
  }

  const confirmed = await Swal.fire({
    title: { nl:'Bevraging indienen?', fr:'Soumettre?', en:'Submit survey?' }[currentLang],
    text: { nl:'U kunt uw antwoorden nadien niet meer wijzigen.', fr:'Vous ne pourrez plus modifier vos réponses.', en:'You will not be able to change your answers afterwards.' }[currentLang],
    icon: 'question',
    showCancelButton: true,
    confirmButtonText: { nl:'Ja, indienen', fr:'Oui, soumettre', en:'Yes, submit' }[currentLang],
    cancelButtonText: { nl:'Controleren', fr:'Vérifier', en:'Check first' }[currentLang],
    confirmButtonColor: '#2A5C42',
    cancelButtonColor: '#6B7280',
    background: '#fff', color: '#111827',
    borderRadius: '16px'
  });
  if (!confirmed.isConfirmed) return;

  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = t.submitting;

  try {
    await fetch('/api/responses', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(ans)
    });
    // Clear auto-save
    localStorage.removeItem('alnoor_survey');

    // Confetti celebration
    confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 }, colors: ['#C9A84C','#2A5C42','#E8C96B','#40916C','#fff'] });
    setTimeout(() => confetti({ particleCount: 60, spread: 120, origin: { y: 0.5 }, colors: ['#C9A84C','#1A3A2A','#E8C96B'] }), 400);

    document.getElementById('survey').style.display = 'none';
    document.getElementById('thankyou').style.display = 'block';
    document.getElementById('prog-fill').style.width = '100%';
    document.getElementById('prog-pct').textContent = '100%';
    document.getElementById('sticky-fill').style.width = '100%';
    document.getElementById('scroll-top').classList.remove('visible');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch {
    btn.disabled = false; btn.textContent = t.submit;
    Swal.fire({ icon: 'error', title: 'Oops!', text: t.err_server, confirmButtonColor: '#2A5C42', background: '#fff', color: '#111827' });
  }
}

/* ═══════════════════════════════════════════════════
   AUTO-SAVE  (localStorage)
═══════════════════════════════════════════════════ */
const STORAGE_KEY = 'alnoor_survey';

function autoSave() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ ans, lang: currentLang, ts: Date.now() })); } catch {}
}

function checkSavedData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    // Only restore if saved less than 24h ago and has at least 2 required answers
    const age = Date.now() - (saved.ts || 0);
    if (age > 86400000) { localStorage.removeItem(STORAGE_KEY); return; }
    const hasAnswers = Object.values(saved.ans).some(v => v && (Array.isArray(v) ? v.length > 0 : v !== null && v !== ''));
    if (!hasAnswers) return;
    window._savedData = saved;
    const banner = document.getElementById('restore-banner');
    const msg = document.getElementById('restore-msg');
    const langLabels = { nl: `<strong>💾 Opgeslagen voortgang gevonden</strong> — Wilt u verdergaan waar u gebleven was?`, fr: `<strong>💾 Progression sauvegardée</strong> — Voulez-vous continuer là où vous vous êtes arrêté(e) ?`, en: `<strong>💾 Saved progress found</strong> — Would you like to continue where you left off?` };
    msg.innerHTML = langLabels[saved.lang] || langLabels.nl;
    banner.style.display = 'flex';
  } catch {}
}

function restoreFromStorage() {
  if (!window._savedData) return;
  const { ans: saved, lang } = window._savedData;
  Object.assign(ans, saved);
  dismissRestore();
  setLang(lang || 'nl');
}

function dismissRestore() {
  document.getElementById('restore-banner').style.display = 'none';
  if (!window._savedData) return;
  const lang = window._savedData?.lang || 'nl';
  window._savedData = null;
  setLang(lang);
}

/* ═══════════════════════════════════════════════════
   STICKY BAR + SCROLL TOP
═══════════════════════════════════════════════════ */
function setupScrollBehavior() {
  const heroHeight = document.querySelector('.hero').offsetHeight + 60;
  window.addEventListener('scroll', () => {
    const scrolled = window.scrollY > heroHeight;
    document.getElementById('sticky-bar').classList.toggle('visible', scrolled);
    document.getElementById('scroll-top').classList.toggle('visible', window.scrollY > 400);
  }, { passive: true });
}

/* ═══════════════════════════════════════════════════
   UPDATE PROGRESS (with auto-save + sticky)
═══════════════════════════════════════════════════ */
function updateProgress() {
  const n = countAnswered(); const t = T[currentLang];
  const pct = Math.round(n / TOTAL_REQ * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = t.progress(n, TOTAL_REQ);
  document.getElementById('prog-pct').textContent = pct + '%';
  // Sticky bar sync
  document.getElementById('sticky-fill').style.width = pct + '%';
  document.getElementById('sticky-pct').textContent = pct + '%';
  // Auto-save
  autoSave();
}

checkSavedData();
