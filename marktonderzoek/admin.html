<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – Marktonderzoek</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a2e; }

    header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: white;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.4rem; font-weight: 600; }
    header nav a {
      color: rgba(255,255,255,0.8);
      text-decoration: none;
      margin-left: 20px;
      font-size: 0.9rem;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.3);
      transition: all 0.2s;
    }
    header nav a:hover { background: rgba(255,255,255,0.1); color: white; }
    header nav a.active { background: #e94560; border-color: #e94560; color: white; }

    .container { max-width: 900px; margin: 32px auto; padding: 0 20px; }

    .tabs { display: flex; gap: 4px; margin-bottom: 24px; }
    .tab {
      padding: 10px 24px; border-radius: 8px 8px 0 0;
      border: none; cursor: pointer;
      font-size: 0.95rem; font-weight: 500;
      background: #dde1ea; color: #555;
      transition: all 0.2s;
    }
    .tab.active { background: white; color: #1a1a2e; box-shadow: 0 -2px 8px rgba(0,0,0,0.06); }

    .panel { background: white; border-radius: 0 12px 12px 12px; padding: 28px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
    .panel.hidden { display: none; }

    h2 { font-size: 1.1rem; margin-bottom: 20px; color: #1a1a2e; }

    /* Form */
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #555; margin-bottom: 6px; }
    input[type="text"], textarea, select {
      width: 100%; padding: 10px 14px; border: 1.5px solid #e0e0e0;
      border-radius: 8px; font-size: 0.95rem; font-family: inherit;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus, textarea:focus, select:focus {
      outline: none; border-color: #e94560;
    }
    textarea { resize: vertical; min-height: 70px; }

    .options-list { display: flex; flex-direction: column; gap: 8px; }
    .option-row { display: flex; gap: 8px; align-items: center; }
    .option-row input { flex: 1; }
    .btn-icon {
      background: none; border: 1.5px solid #e0e0e0; border-radius: 6px;
      width: 36px; height: 36px; cursor: pointer; font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; color: #888;
    }
    .btn-icon:hover { background: #fff0f3; border-color: #e94560; color: #e94560; }
    .btn-add-option {
      background: none; border: 1.5px dashed #ccc; border-radius: 8px;
      padding: 8px 16px; cursor: pointer; font-size: 0.85rem; color: #888;
      margin-top: 4px; width: 100%; transition: all 0.2s;
    }
    .btn-add-option:hover { border-color: #e94560; color: #e94560; }

    .scale-config { display: flex; gap: 12px; }
    .scale-config .form-group { flex: 1; }

    .btn {
      padding: 11px 24px; border-radius: 8px; border: none;
      cursor: pointer; font-size: 0.95rem; font-weight: 600;
      transition: all 0.2s;
    }
    .btn-primary { background: #e94560; color: white; }
    .btn-primary:hover { background: #c73652; }
    .btn-secondary { background: #f0f2f5; color: #444; }
    .btn-secondary:hover { background: #e0e3ea; }
    .btn-danger { background: #fff0f3; color: #e94560; border: 1.5px solid #e94560; }
    .btn-danger:hover { background: #e94560; color: white; }
    .btn-success { background: #10b981; color: white; }
    .btn-success:hover { background: #059669; }

    /* Question list */
    .question-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    .question-card {
      border: 1.5px solid #e8eaf0; border-radius: 10px; padding: 16px 20px;
      display: flex; align-items: flex-start; gap: 16px;
      background: #fafbfc; transition: border-color 0.2s;
    }
    .question-card:hover { border-color: #c8ccd8; }
    .q-drag { color: #bbb; cursor: grab; font-size: 1.2rem; padding-top: 2px; }
    .q-body { flex: 1; }
    .q-number { font-size: 0.75rem; font-weight: 700; color: #e94560; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .q-text { font-weight: 600; margin-bottom: 4px; }
    .q-type { font-size: 0.8rem; color: #888; }
    .q-actions { display: flex; gap: 8px; }

    .empty-state {
      text-align: center; padding: 48px 20px; color: #aaa;
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }

    /* Results */
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px; }
    .stat-card {
      background: #f8f9fc; border-radius: 10px; padding: 20px;
      text-align: center; border: 1.5px solid #e8eaf0;
    }
    .stat-value { font-size: 2rem; font-weight: 700; color: #e94560; }
    .stat-label { font-size: 0.8rem; color: #888; margin-top: 4px; }

    .result-block { margin-bottom: 28px; }
    .result-block h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 14px; }
    .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; font-size: 0.85rem; }
    .bar-label { width: 160px; flex-shrink: 0; color: #555; }
    .bar-track { flex: 1; background: #f0f2f5; border-radius: 99px; height: 18px; overflow: hidden; }
    .bar-fill { background: linear-gradient(90deg, #e94560, #f77); height: 100%; border-radius: 99px; transition: width 0.5s; }
    .bar-count { width: 40px; text-align: right; font-weight: 600; color: #333; }

    .score-display { font-size: 2.5rem; font-weight: 700; color: #e94560; margin-bottom: 4px; }
    .score-sub { font-size: 0.85rem; color: #888; }

    .responses-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .responses-table th { background: #f0f2f5; padding: 10px 14px; text-align: left; font-weight: 600; }
    .responses-table td { padding: 10px 14px; border-bottom: 1px solid #f0f2f5; }
    .responses-table tr:last-child td { border-bottom: none; }

    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: #1a1a2e; color: white;
      padding: 12px 20px; border-radius: 10px;
      font-size: 0.9rem; font-weight: 500;
      opacity: 0; transform: translateY(10px);
      transition: all 0.3s; pointer-events: none; z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    .type-options { display: none; }
    .type-options.visible { display: block; }

    .action-bar { display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap; }
  </style>
</head>
<body>

<header>
  <h1>Marktonderzoek — Admin</h1>
  <nav>
    <a href="admin.html" class="active">Admin</a>
    <a href="survey.html">Survey bekijken</a>
  </nav>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="showTab('vragen')">Vragen beheren</button>
    <button class="tab" onclick="showTab('resultaten')">Resultaten</button>
  </div>

  <!-- VRAGEN TAB -->
  <div class="panel" id="tab-vragen">
    <h2>Vragen toevoegen</h2>

    <div class="form-group">
      <label>Vraagtekst</label>
      <textarea id="q-text" placeholder="Typ hier je vraag..."></textarea>
    </div>

    <div class="form-group">
      <label>Vraagtype</label>
      <select id="q-type" onchange="onTypeChange()">
        <option value="multiple_choice">Multiple choice (één antwoord)</option>
        <option value="checkboxes">Meerdere keuze (checkboxes)</option>
        <option value="scale">Schaal</option>
        <option value="open">Open tekstveld</option>
      </select>
    </div>

    <div class="type-options visible" id="opts-choices">
      <div class="form-group">
        <label>Antwoordopties</label>
        <div class="options-list" id="options-list">
          <div class="option-row"><input type="text" placeholder="Optie 1"><button class="btn-icon" onclick="removeOption(this)">✕</button></div>
          <div class="option-row"><input type="text" placeholder="Optie 2"><button class="btn-icon" onclick="removeOption(this)">✕</button></div>
        </div>
        <button class="btn-add-option" onclick="addOption()">+ Optie toevoegen</button>
      </div>
    </div>

    <div class="type-options" id="opts-scale">
      <div class="scale-config">
        <div class="form-group">
          <label>Min</label>
          <input type="text" id="scale-min" value="1">
        </div>
        <div class="form-group">
          <label>Max</label>
          <input type="text" id="scale-max" value="5">
        </div>
        <div class="form-group">
          <label>Label min</label>
          <input type="text" id="scale-label-min" placeholder="Helemaal niet akkoord">
        </div>
        <div class="form-group">
          <label>Label max</label>
          <input type="text" id="scale-label-max" placeholder="Helemaal akkoord">
        </div>
      </div>
    </div>

    <div class="form-group">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
        <input type="checkbox" id="q-required" checked style="width:auto;">
        Verplicht veld
      </label>
    </div>

    <div style="display:flex;gap:12px;">
      <button class="btn btn-primary" onclick="saveQuestion()">Vraag opslaan</button>
      <button class="btn btn-secondary" onclick="cancelEdit()">Annuleren</button>
    </div>

    <hr style="margin: 28px 0; border: none; border-top: 1.5px solid #f0f2f5;">

    <h2>Vragen (<span id="q-count">0</span>)</h2>
    <div class="question-list" id="question-list"></div>
    <div class="empty-state" id="empty-state">
      <div class="icon">📋</div>
      <p>Nog geen vragen. Voeg hierboven je eerste vraag toe.</p>
    </div>
  </div>

  <!-- RESULTATEN TAB -->
  <div class="panel hidden" id="tab-resultaten">
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-value" id="stat-responses">0</div>
        <div class="stat-label">Antwoorden</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-questions">0</div>
        <div class="stat-label">Vragen</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-completion">—</div>
        <div class="stat-label">Laatste invulling</div>
      </div>
    </div>

    <div id="results-container"></div>

    <div class="action-bar" style="margin-top:24px;">
      <a id="export-btn" href="/api/responses/export" class="btn btn-success">CSV exporteren</a>
      <button class="btn btn-secondary" onclick="loadResults()">Vernieuwen</button>
      <button class="btn btn-danger" onclick="clearResponses()">Alle antwoorden wissen</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let questions = [];
let editingId = null;

async function loadQuestions() {
  const res = await fetch('/api/questions');
  questions = await res.json();
  renderQuestions();
}

function renderQuestions() {
  const list = document.getElementById('question-list');
  const empty = document.getElementById('empty-state');
  document.getElementById('q-count').textContent = questions.length;

  if (questions.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  list.innerHTML = questions.map((q, i) => {
    const typeLabel = { multiple_choice: 'Multiple choice', checkboxes: 'Checkboxes', scale: 'Schaal', open: 'Open tekst' }[q.type] || q.type;
    return `<div class="question-card" data-id="${q.id}">
      <div class="q-drag">⠿</div>
      <div class="q-body">
        <div class="q-number">Vraag ${i + 1}</div>
        <div class="q-text">${q.text}</div>
        <div class="q-type">${typeLabel}${q.required ? ' · Verplicht' : ''}</div>
      </div>
      <div class="q-actions">
        <button class="btn-icon" onclick="editQuestion('${q.id}')" title="Bewerken">✏️</button>
        <button class="btn-icon" onclick="deleteQuestion('${q.id}')" title="Verwijderen">🗑️</button>
      </div>
    </div>`;
  }).join('');
}

function onTypeChange() {
  const type = document.getElementById('q-type').value;
  document.getElementById('opts-choices').classList.toggle('visible', type === 'multiple_choice' || type === 'checkboxes');
  document.getElementById('opts-scale').classList.toggle('visible', type === 'scale');
}

function addOption() {
  const list = document.getElementById('options-list');
  const n = list.children.length + 1;
  const row = document.createElement('div');
  row.className = 'option-row';
  row.innerHTML = `<input type="text" placeholder="Optie ${n}"><button class="btn-icon" onclick="removeOption(this)">✕</button>`;
  list.appendChild(row);
}

function removeOption(btn) {
  const row = btn.parentElement;
  if (row.parentElement.children.length > 1) row.remove();
}

async function saveQuestion() {
  const text = document.getElementById('q-text').value.trim();
  if (!text) { showToast('Vul een vraagtekst in.'); return; }

  const type = document.getElementById('q-type').value;
  const required = document.getElementById('q-required').checked;
  let payload = { text, type, required };

  if (type === 'multiple_choice' || type === 'checkboxes') {
    const opts = [...document.querySelectorAll('#options-list .option-row input')]
      .map(i => i.value.trim()).filter(Boolean);
    if (opts.length < 2) { showToast('Voeg minstens 2 opties toe.'); return; }
    payload.options = opts;
  }

  if (type === 'scale') {
    payload.scaleMin = parseInt(document.getElementById('scale-min').value) || 1;
    payload.scaleMax = parseInt(document.getElementById('scale-max').value) || 5;
    payload.labelMin = document.getElementById('scale-label-min').value.trim();
    payload.labelMax = document.getElementById('scale-label-max').value.trim();
  }

  if (editingId) {
    await fetch(`/api/questions/${editingId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    showToast('Vraag bijgewerkt.');
  } else {
    await fetch('/api/questions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    showToast('Vraag opgeslagen.');
  }

  cancelEdit();
  loadQuestions();
}

function editQuestion(id) {
  const q = questions.find(x => x.id === id);
  if (!q) return;
  editingId = id;

  document.getElementById('q-text').value = q.text;
  document.getElementById('q-type').value = q.type;
  document.getElementById('q-required').checked = q.required;
  onTypeChange();

  if (q.options) {
    const list = document.getElementById('options-list');
    list.innerHTML = '';
    q.options.forEach(opt => {
      const row = document.createElement('div');
      row.className = 'option-row';
      row.innerHTML = `<input type="text" value="${opt}"><button class="btn-icon" onclick="removeOption(this)">✕</button>`;
      list.appendChild(row);
    });
  }

  if (q.type === 'scale') {
    document.getElementById('scale-min').value = q.scaleMin ?? 1;
    document.getElementById('scale-max').value = q.scaleMax ?? 5;
    document.getElementById('scale-label-min').value = q.labelMin || '';
    document.getElementById('scale-label-max').value = q.labelMax || '';
  }

  document.querySelector('.btn-primary').textContent = 'Vraag bijwerken';
  window.scrollTo(0, 0);
}

function cancelEdit() {
  editingId = null;
  document.getElementById('q-text').value = '';
  document.getElementById('q-type').value = 'multiple_choice';
  document.getElementById('q-required').checked = true;
  document.getElementById('options-list').innerHTML = `
    <div class="option-row"><input type="text" placeholder="Optie 1"><button class="btn-icon" onclick="removeOption(this)">✕</button></div>
    <div class="option-row"><input type="text" placeholder="Optie 2"><button class="btn-icon" onclick="removeOption(this)">✕</button></div>`;
  document.getElementById('scale-min').value = '1';
  document.getElementById('scale-max').value = '5';
  document.getElementById('scale-label-min').value = '';
  document.getElementById('scale-label-max').value = '';
  document.querySelector('.btn-primary').textContent = 'Vraag opslaan';
  onTypeChange();
}

async function deleteQuestion(id) {
  if (!confirm('Vraag verwijderen?')) return;
  await fetch(`/api/questions/${id}`, { method: 'DELETE' });
  showToast('Vraag verwijderd.');
  loadQuestions();
}

async function loadResults() {
  const [rRes, qRes] = await Promise.all([fetch('/api/responses'), fetch('/api/questions')]);
  const responses = await rRes.json();
  const qs = await qRes.json();

  document.getElementById('stat-responses').textContent = responses.length;
  document.getElementById('stat-questions').textContent = qs.length;

  if (responses.length > 0) {
    const last = new Date(responses[responses.length - 1].timestamp);
    document.getElementById('stat-completion').textContent = last.toLocaleDateString('nl-BE');
  }

  const container = document.getElementById('results-container');
  if (responses.length === 0 || qs.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">📊</div><p>Nog geen antwoorden ontvangen.</p></div>';
    return;
  }

  container.innerHTML = qs.map(q => {
    const typeLabel = { multiple_choice: 'Multiple choice', checkboxes: 'Checkboxes', scale: 'Schaal', open: 'Open tekst' }[q.type];
    let html = `<div class="result-block"><h3>${q.text} <span style="font-weight:400;color:#aaa;font-size:0.8rem">${typeLabel}</span></h3>`;

    if (q.type === 'multiple_choice' || q.type === 'checkboxes') {
      const counts = {};
      (q.options || []).forEach(o => counts[o] = 0);
      responses.forEach(r => {
        const ans = r.answers[q.id];
        if (!ans) return;
        const vals = Array.isArray(ans) ? ans : [ans];
        vals.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
      });
      const total = Object.values(counts).reduce((a, b) => a + b, 0) || 1;
      html += Object.entries(counts).map(([label, count]) =>
        `<div class="bar-row">
          <div class="bar-label">${label}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(count/total*100)}%"></div></div>
          <div class="bar-count">${count}</div>
        </div>`
      ).join('');
    }

    if (q.type === 'scale') {
      const vals = responses.map(r => parseFloat(r.answers[q.id])).filter(v => !isNaN(v));
      const avg = vals.length ? (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1) : '—';
      html += `<div class="score-display">${avg} / ${q.scaleMax || 5}</div>
        <div class="score-sub">Gemiddelde van ${vals.length} antwoorden</div>`;
    }

    if (q.type === 'open') {
      const answers = responses.map(r => r.answers[q.id]).filter(Boolean);
      html += answers.length === 0
        ? '<em style="color:#aaa">Geen antwoorden</em>'
        : answers.map(a => `<div style="background:#f8f9fc;padding:10px 14px;border-radius:8px;margin-bottom:8px;font-size:0.9rem;">"${a}"</div>`).join('');
    }

    html += '</div>';
    return html;
  }).join('');
}

function showTab(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + name).classList.remove('hidden');
  event.target.classList.add('active');
  if (name === 'resultaten') loadResults();
}

async function clearResponses() {
  if (!confirm('Alle antwoorden definitief wissen?')) return;
  await fetch('/api/responses', { method: 'DELETE' });
  showToast('Antwoorden gewist.');
  loadResults();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

loadQuestions();
</script>
</body>
</html>
