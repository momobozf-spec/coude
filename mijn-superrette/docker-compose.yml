# Local infrastructure for development: PostgreSQL 16 + Redis 7.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: superrette
      POSTGRES_PASSWORD: superrette
      POSTGRES_DB: superrette_dev
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data', './infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U superrette']
      interval: 5s
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
volumes:
  pgdata:
