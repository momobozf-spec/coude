services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: immoradar
      POSTGRES_PASSWORD: immoradar
      POSTGRES_DB: immoradar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immoradar"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://immoradar:immoradar@db:5432/immoradar
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production-please}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  pgdata:
