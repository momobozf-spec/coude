services:
  db:
    image: postgres:16-alpine
    container_name: immoradar-db
    environment:
      POSTGRES_USER: immoradar
      POSTGRES_PASSWORD: immoradar
      POSTGRES_DB: immoradar
    ports:
      - "5432:5432"
    volumes:
      - immoradar-pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immoradar -d immoradar"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: immoradar-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://immoradar:immoradar@db:5432/immoradar
      AUTH_SECRET: ${AUTH_SECRET:-docker-dev-secret-change-me-please-32chars}
      CRON_SECRET: ${CRON_SECRET:-docker-cron-secret}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      APP_URL: http://localhost:3000
      NODE_ENV: production
    ports:
      - "3000:3000"
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts && npm run start"

volumes:
  immoradar-pgdata:
