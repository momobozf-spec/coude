<!doctype html>
<html lang="nl-BE">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e5a43" />
    <title>Offline · Superette</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
        --canvas: #f2f3ee;
        --raised: #ffffff;
        --ink: #16201b;
        --muted: #56615b;
        --bar: #0e5a43;
        --bar-ink: #ffffff;
        --tag: #ffd43b;
        --tag-ink: #211c00;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #0c1310;
          --raised: #141d19;
          --ink: #e9efea;
          --muted: #9baba2;
          --bar: #101a16;
          --bar-ink: #e9efea;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--canvas);
        color: var(--ink);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        display: flex;
        flex-direction: column;
      }
      header {
        background: var(--bar);
        color: var(--bar-ink);
        padding: calc(env(safe-area-inset-top) + 14px) 20px 14px;
        font-weight: 800;
        font-size: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 20px calc(env(safe-area-inset-bottom) + 24px);
      }
      .card {
        background: var(--raised);
        border-radius: 18px;
        padding: 28px 24px;
        max-width: 26rem;
        width: 100%;
        text-align: center;
        box-shadow: 0 6px 18px -10px rgb(0 0 0 / 0.3);
      }
      h1 {
        font-size: 26px;
        line-height: 1.15;
        margin: 16px 0 8px;
      }
      p {
        color: var(--muted);
        margin: 0 0 6px;
        line-height: 1.5;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 22px;
        margin-top: 18px;
        border-radius: 14px;
        background: var(--tag);
        color: var(--tag-ink);
        font-weight: 700;
        text-decoration: none;
      }
      a.button:focus-visible {
        outline: 3px solid #1d4ed8;
        outline-offset: 2px;
      }
      .other {
        font-size: 13px;
        margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <header>
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="1" y="1" width="30" height="30" rx="8" fill="#ffd43b" />
        <circle cx="7.5" cy="16" r="2.2" fill="#211c00" />
        <path d="M13 11.5h11M13 16h11M13 20.5h7" stroke="#211c00" stroke-width="2.6" stroke-linecap="round" />
      </svg>
      Superette
    </header>
    <main>
      <div class="card">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0" />
          <circle cx="12" cy="19.5" r="0.8" fill="currentColor" />
          <path d="M3 3l18 18" />
        </svg>
        <h1>Je bent offline</h1>
        <p>Superette heeft internet nodig om actuele prijzen op te halen. Controleer je verbinding en probeer opnieuw.</p>
        <a class="button" href="/">Opnieuw proberen</a>
        <p class="other" lang="fr-BE">Vous êtes hors ligne. Vérifiez votre connexion.</p>
        <p class="other" lang="en">You’re offline. Check your connection and try again.</p>
      </div>
    </main>
  </body>
</html>
