# Copy to .github/workflows/cron.yml in the repository.
#
# Render's free plan has no cron jobs, so GitHub Actions calls the maintenance
# endpoint once a day: it completes account deletions whose grace period has
# passed and prunes expired rate-limit windows.
#
# Repository → Settings → Secrets and variables → Actions → New repository secret:
#   APP_URL             https://muslim-life-test.onrender.com   (your URL)
#   HEALTH_CHECK_TOKEN  the value Render generated (Environment tab)
name: maintenance

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the service (free plan sleeps)
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 60 "${{ secrets.APP_URL }}/api/ready" >/dev/null; then exit 0; fi
            sleep 20
          done
          echo "Service did not wake up" && exit 1
      - name: Run maintenance
        run: |
          curl -fsS --max-time 290 -X POST \
            -H "Authorization: Bearer ${{ secrets.HEALTH_CHECK_TOKEN }}" \
            "${{ secrets.APP_URL }}/api/jobs/maintenance"
