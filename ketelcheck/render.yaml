# Render Blueprint — KetelCheck statische site (Blueprint path: ketelcheck/render.yaml).
# De build is enkel een controle: hij FAALT zolang er placeholders in web/assets/config.js staan.
services:
  - type: web
    name: ketelcheck
    runtime: static
    rootDir: ketelcheck
    buildCommand: node tools/check-deploy.cjs
    staticPublishPath: ./web
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: X-Frame-Options
        value: DENY
