<style>
/* Layout: a night-sky band carries the promise and a phone showing the app; below it, a paper page for parents — what's inside, why it's safe, the sign-up form, questions. */
:root {
  color-scheme: light;
  --night: #141a3a;      /* hero band and footer */
  --night-2: #1e2652;
  --moon: #ffd36e;       /* the one accent */
  --paper: #fff8ea;      /* page ground */
  --card: #ffffff;
  --ink: #2a2440;        /* text on paper */
  --ink-soft: #625b7a;
  --line: #eadfc8;
  --rose: #f07a8c; --teal: #5fb3a3; --plum: #a2569a;
  --on-night: #eef0ff; --on-night-soft: #b6bce4;
  --display: "Baloo Bhaijaan 2", "Baloo 2", "Noto Sans Arabic", system-ui, sans-serif;
  --body: "Nunito Sans", "Noto Sans Arabic", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; }
.wrap {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--display); line-height: 1.12; margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; }
button, input, select { font: inherit; }
:focus-visible { outline: 3px solid var(--moon); outline-offset: 3px; }

/* Hero */
.hero { background: var(--night); color: var(--on-night); position: relative; overflow: hidden; }
.hero .stars { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.hero .wrap { position: relative; padding-block: 18px 56px; display: grid; gap: 28px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 1.4rem; }
.logo svg { width: 44px; height: 44px; }
.langs { display: flex; gap: 4px; background: var(--night-2); padding: 4px; border-radius: 999px; }
.langs button { border: 0; background: none; color: var(--on-night-soft); font-weight: 700; padding: 6px 14px; border-radius: 999px; cursor: pointer; min-height: 40px; }
.langs button[aria-pressed="true"] { background: var(--moon); color: var(--ink); }
.hero-grid { display: grid; gap: 32px; align-items: center; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 860px) { .hero-grid { grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); } }
.hero h1 { font-size: clamp(2.2rem, 6.2vw, 3.6rem); font-weight: 800; }
.hero h1 em { font-style: normal; color: var(--moon); }
.hero .lead { color: var(--on-night-soft); font-size: 1.15rem; max-width: 34em; margin-top: 14px; }
.cta { display: inline-flex; align-items: center; gap: 8px; margin-top: 22px; background: var(--moon); color: var(--ink); font-family: var(--display); font-weight: 800; font-size: 1.15rem; text-decoration: none; border-radius: 999px; padding: 12px 26px; min-height: 56px; }
.ages { margin-top: 14px; color: var(--on-night-soft); font-size: .95rem; }
.phone { justify-self: center; width: min(300px, 80vw); aspect-ratio: 9 / 18.5; max-width: 100%; background: #0c1030; border-radius: 40px; padding: 12px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.6), inset 0 0 0 2px #2b356b; }
.screen { width: 100%; height: 100%; border-radius: 30px; overflow: hidden; background: var(--night-2); display: grid; grid-template-rows: auto 1fr auto; }
.screen svg { display: block; width: 100%; height: auto; }
.screen .story-text { background: var(--paper); color: var(--ink); margin: 10px; border-radius: 18px; padding: 12px 14px; font-family: var(--display); font-weight: 700; font-size: .98rem; line-height: 1.45; align-self: start; }
.screen .story-text b { color: var(--plum); }
.screen .bar { display: flex; justify-content: space-between; padding: 0 14px 16px; }
.screen .bar span { width: 44px; height: 44px; border-radius: 50%; background: var(--moon); display: grid; place-items: center; color: var(--ink); font-weight: 800; }
.screen .bar span.read { width: auto; padding: 0 16px; border-radius: 999px; background: var(--paper); font-family: var(--display); font-size: .9rem; }

/* Sections */
section { padding-block: 56px; }
.eyebrow { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .78rem; color: var(--plum); }
[dir="rtl"] .eyebrow { letter-spacing: 0; }
.sec-head { display: grid; gap: 8px; margin-bottom: 26px; max-width: 40em; }
.sec-head h2 { font-size: clamp(1.7rem, 4.4vw, 2.4rem); font-weight: 800; }
.features { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.feature { background: var(--card); border-radius: 24px; padding: 18px; display: grid; gap: 10px; align-content: start; border: 1px solid var(--line); }
.feature .art { border-radius: 16px; height: 140px; display: grid; place-items: center; overflow: hidden; }
.feature .art svg { width: 100%; height: 100%; }
.feature h3 { font-size: 1.35rem; font-weight: 800; }
.feature p { color: var(--ink-soft); }

.promise { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.promise li { list-style: none; display: flex; gap: 12px; align-items: flex-start; }
.promise ul { margin: 0; padding: 0; display: contents; }
.tick { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--teal); color: #fff; display: grid; place-items: center; font-weight: 800; }
.promise strong { display: block; font-size: 1.05rem; }
.promise span.t { color: var(--ink-soft); font-size: .95rem; }

/* Sign-up */
.signup { background: var(--card); border: 1px solid var(--line); border-radius: 28px; padding: clamp(20px, 4vw, 36px); display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 860px) { .signup { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
.signup h2 { font-size: clamp(1.7rem, 4.4vw, 2.3rem); font-weight: 800; }
.signup .intro { color: var(--ink-soft); margin-top: 10px; }
form { display: grid; gap: 14px; }
label.f { display: grid; gap: 6px; font-weight: 700; font-size: .95rem; }
input[type="email"], select { width: 100%; min-height: 52px; border: 2px solid var(--line); border-radius: 14px; padding: 0 14px; background: var(--paper); color: var(--ink); }
input[type="email"]:focus, select:focus { border-color: var(--plum); outline: none; }
.consent { display: flex; gap: 10px; align-items: flex-start; font-size: .9rem; color: var(--ink-soft); }
.consent input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--plum); flex: none; }
.submit { border: 0; background: var(--night); color: var(--on-night); font-family: var(--display); font-weight: 800; font-size: 1.15rem; border-radius: 999px; min-height: 56px; cursor: pointer; }
.msg { font-weight: 700; min-height: 1.5em; }
.msg.err { color: #b23a4f; }
.msg.ok { color: #2f6b5e; }
.preview-note { font-size: .85rem; color: var(--ink-soft); background: var(--paper); border-radius: 12px; padding: 8px 12px; }

/* FAQ */
.faq { display: grid; gap: 10px; max-width: 760px; }
details { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 18px; }
summary { cursor: pointer; font-weight: 700; font-size: 1.05rem; }
details p { color: var(--ink-soft); margin-top: 8px; }

footer { background: var(--night); color: var(--on-night-soft); font-size: .9rem; }
footer .wrap { padding-block: 26px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

@keyframes twinkle { 0%, 100% { opacity: .3 } 50% { opacity: 1 } }
.tw { animation: twinkle 3.4s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .tw { animation: none; } }
</style>

</header>

<main>

      <div class="features">

        <article class="feature"><div class="art" style="background:#fdeccb" id="art-color"></div><h3 data-t="f2t"></h3><p data-t="f2p"></p></article>
        <article class="feature"><div class="art" style="background:#d6efe9" id="art-games"></div><h3 data-t="f3t"></h3><p data-t="f3p"></p></article>
      </div>
    </div>
  </section>

  <section style="padding-top:0">
    <div class="wrap">
      <div class="sec-head"><p class="eyebrow" data-t="safeEyebrow"></p><h2 data-t="safeTitle"></h2></div>
      <div class="promise" id="promise"></div>
    </div>
  </section>

  <section id="inschrijven" style="padding-top:0">
    <div class="wrap">
      <div class="signup">
        <div>
          <p class="eyebrow" data-t="signEyebrow"></p>

          <label class="consent" for="consent"><input type="checkbox" id="consent" name="consent" required><span data-t="consent"></span></label>
          <button type="submit" class="submit" id="submit" data-t="submit"></button>
          <p class="msg" id="msg" role="status"></p>
          <p class="preview-note" id="preview-note" data-t="previewNote" hidden></p>

    </div>
  </section>

  <section style="padding-top:0">

      <div class="faq" id="faq"></div>
    </div>
  </section>
</main>

        ['مراجعة قبل النشر', 'يراجع إمامٌ كل قصة وكل دعاء. ولا يُصوَّر الأنبياء أبدًا.'],
      ],
      signEyebrow: 'قائمة الانتظار',
      signTitle: 'كونوا من الأوائل',
      signIntro: 'سجّلوا لتكونوا أول من يعلم بانطلاق «قمر الصغير»، مع عرض للعائلات الأولى. بضع رسائل فقط حتى الانطلاق.',
      emailLabel: 'بريدك الإلكتروني',
      consent: 'أوافق على تلقي رسائل حول انطلاق «قمر الصغير»، ويمكنني إلغاء الاشتراك في أي وقت. تستخدم شركة Marhaba Data & AI Agent BV عنواني لهذا الغرض فقط.',
      submit: 'سجّلني',
      errEmail: 'أدخل بريدًا إلكترونيًا صحيحًا، مثل name@example.be.',
      errConsent: 'ضع علامة للموافقة على تلقي الرسائل.',
      ok: 'شكرًا! أنت الآن في قائمة الانتظار. تحقق من بريدك لتأكيد التسجيل.',
      errSend: 'لم ينجح التسجيل. حاول مرة أخرى بعد قليل.',
      previewNote: 'هذه معاينة للصفحة: لا يُرسَل شيء بعد.',
      faqEyebrow: 'أسئلة',
      faqTitle: 'ما يسألنا عنه الآباء',
      faq: [
        ['لأي عمر؟', 'للأطفال من 3 إلى 8 سنوات تقريبًا. القصص قصيرة والألعاب لا تحتاج إلى القراءة.'],
        ['ما اللغات المتاحة؟', 'العربية والهولندية والفرنسية. تختار اللغة في التطبيق ويمكنك تغييرها في أي وقت.'],
        ['كم السعر؟', 'جزء مجاني لتجربته أولًا. ولكل القصص والألعاب سيكون هناك اشتراك عائلي، ونعلن السعر عند الانطلاق.'],
        ['هل يعمل على جهازي؟', 'نعم، على أي جهاز لوحي أو هاتف حديث، عبر المتصفح. لا حاجة إلى التثبيت.'],
      ],
      footerNote: 'صُنع في بلجيكا',
    },
  }

  let lang = 'nl'
  try {
    const saved = localStorage.getItem('qamar-landing-lang')
    if (T[saved]) lang = saved
    else if ((navigator.language || '').toLowerCase().startsWith('fr')) lang = 'fr'
    else if ((navigator.language || '').toLowerCase().startsWith('ar')) lang = 'ar'
  } catch (e) {}

  // ── Drawings (original shapes) ───────────────────────────────────────────
  const moon = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})">
      <path d="M10 -46 A46 46 0 1 0 10 46 A66 66 0 0 1 10 -46 Z" fill="#ffd36e"/>
      <path d="M-30 -6 q5 -6 10 0" stroke="#7a4b14" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M-29 14 q8 8 16 0" stroke="#7a4b14" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path class="tw" d="M40 -40 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#ffe7ad"/></g>`
  const starsIn = (w, h, n) => Array.from({ length: n }, (_, i) =>
      `<circle class="tw" style="animation-delay:${(i % 6) * .5}s" cx="${(i * 47.3) % w}" cy="${(i * 29.7) % (h * .7)}" r="${i % 4 ? 1.4 : 2.2}" fill="#fff"/>`).join('')
  const SVG = {
    phone: `<rect width="300" height="220" fill="#1e2652"/>${starsIn(300, 220, 14)}${moon(220, 70, .8)}
      <rect y="180" width="300" height="40" fill="#2f6b5e"/>
      <g transform="translate(40 118)"><rect y="18" width="110" height="64" rx="6" fill="#e88d67"/><path d="M-8 22 L55 -16 L118 22Z" fill="#8e4a62"/><rect x="16" y="36" width="30" height="24" rx="4" fill="#ffd36e"/><rect x="68" y="44" width="26" height="38" rx="4" fill="#a46a45"/></g>`,
    story: `<svg viewBox="0 0 300 140" preserveAspectRatio="xMidYMid slice">${starsIn(300, 140, 12)}${moon(150, 70, .9)}</svg>`,
    color: `<svg viewBox="0 0 300 140"><g transform="translate(115 6)" stroke="#2a2440" stroke-width="3" stroke-linejoin="round">
      <circle cx="35" cy="10" r="7" fill="none"/><path d="M8 40 Q35 4 62 40Z" fill="#e88d67"/><rect x="4" y="40" width="62" height="10" rx="3" fill="#a2569a"/>
      <path d="M8 50h27v62H14z" fill="#f07a8c"/><path d="M35 50h27l-6 62H35z" fill="#5fb3a3"/><path d="M18 62q8-8 14 0v34H18z" fill="#ffd36e"/>
      <path d="M40 62q8-8 14 0v34H40z" fill="#fff8ea"/><rect x="10" y="112" width="50" height="10" rx="3" fill="#a2569a"/></g>
      <path d="M230 30 l8 16 18 2 -14 12 4 18 -16 -10 -16 10 4 -18 -14 -12 18 -2z" fill="#fff8ea" stroke="#2a2440" stroke-width="3" stroke-linejoin="round"/>
      <path d="M60 104 q20 -30 46 -6" stroke="#4a7fd6" stroke-width="7" fill="none" stroke-linecap="round"/></svg>`,
    games: `<svg viewBox="0 0 300 140"><g font-family="Baloo Bhaijaan 2, sans-serif" font-weight="800" text-anchor="middle">
      <rect x="22" y="22" width="78" height="96" rx="14" fill="#fff"/><text x="61" y="92" font-size="58" fill="#2a2440">ب</text>
      <rect x="111" y="22" width="78" height="96" rx="14" fill="#fff"/>
      <g transform="translate(125 40)"><rect x="6" y="40" width="7" height="44" fill="#4a7fd6"/><path d="M4 40 L9.5 28 L15 40Z" fill="#4a7fd6"/><path d="M18 58 Q34 32 50 58Z" fill="#5fb3a3"/><rect x="18" y="58" width="32" height="26" fill="#8fd3c4"/></g>
      <rect x="200" y="22" width="78" height="96" rx="14" fill="#1e2652"/>${moon(239, 70, .5)}</g></svg>`,
  }

  function apply() {
    const t = T[lang]
    document.documentElement.lang = lang
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'
    document.title = lang === 'nl' ? 'Kleine Qamar wachtlijst' : lang === 'fr' ? 'Petit Qamar liste d’attente' : 'قمر الصغير'
    document.getElementById('logo').innerHTML = `<svg viewBox="-60 -60 120 120" aria-hidden="true">${moon(0, 0, 1)}</svg><span>${t.name}</span>`
    document.querySelectorAll('[data-t]').forEach(el => { const v = t[el.dataset.t]; if (typeof v === 'string') el.innerHTML = v })
    document.getElementById('promise').innerHTML = '<ul>' + t.promise.map(([h, p]) =>
      `<li><span class="tick" aria-hidden="true">✓</span><div><strong>${h}</strong><span class="t">${p}</span></div></li>`).join('') + '</ul>'
    document.getElementById('faq').innerHTML = t.faq.map(([q, a], i) =>
      `<details id="faq-${i}"><summary>${q}</summary><p>${a}</p></details>`).join('')
    document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)))
    document.getElementById('msg').textContent = ''
  }

  document.querySelectorAll('.langs button').forEach(b => b.onclick = () => {
    lang = b.dataset.lang
    try { localStorage.setItem('qamar-landing-lang', lang) } catch (e) {}
    apply()
  })

  // Static art
  document.getElementById('phone-scene').innerHTML = SVG.phone
  document.getElementById('art-story').innerHTML = SVG.story
  document.getElementById('art-color').innerHTML = SVG.color
  document.getElementById('art-games').innerHTML = SVG.games
  document.getElementById('stars').innerHTML = Array.from({ length: 36 }, (_, i) =>
    `<circle class="tw" style="animation-delay:${(i % 7) * .45}s" cx="${(i * 37.7) % 100}" cy="${(i * 61.3) % 100}" r="${i % 5 ? .16 : .28}" fill="#fff" opacity=".7"/>`).join('')

  // Sign-up
  const form = document.getElementById('form')
  const msg = document.getElementById('msg')
  const note = document.getElementById('preview-note')
  // Inside the claude.ai preview the page cannot reach Brevo; on the real site it can.
  const IN_PREVIEW = /claude\.ai|claudeusercontent|anthropic/.test(location.hostname) || location.protocol === 'file:'
  note.hidden = !IN_PREVIEW

  form.addEventListener('submit', async e => {
    e.preventDefault()
    const t = T[lang]
    const email = document.getElementById('email').value.trim()
    msg.className = 'msg'
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { msg.classList.add('err'); msg.textContent = t.errEmail; return }
    if (!document.getElementById('consent').checked) { msg.classList.add('err'); msg.textContent = t.errConsent; return }

    if (!FORM_ENDPOINT || IN_PREVIEW) { msg.classList.add('ok'); msg.textContent = t.previewNote; return }

    const button = document.getElementById('submit')
    button.disabled = true
    try {
      const body = new FormData()
      body.append('EMAIL', email)
      body.append('email_address_check', '')
      body.append('locale', BREVO_LOCALE[lang])
      body.append('html_type', 'simple')
      // Brevo does not allow reading the answer cross-site; a network failure still throws.
      await fetch(FORM_ENDPOINT, { method: 'POST', body, mode: 'no-cors' })
      msg.classList.add('ok'); msg.textContent = t.ok
      form.reset()
    } catch (err) {
      msg.classList.add('err'); msg.textContent = t.errSend
    } finally {
      button.disabled = false
    }
  })

  apply()
})()
</script>

</body></html>
