لب."}},{scene:"brightMoon",text:{nl:"Samen zeggen ze: <b>Alhamdulillah</b>! En Qamar straalt nog wat feller aan de hemel.",fr:"Ensemble, ils disent : <b>Alhamdulillah</b> ! Et Qamar brille encore plus fort dans le ciel.",ar:"يقولان معًا: <b>الحمد لله</b>! ويتلألأ قمر في السماء أكثر من قبل."}},{scene:"question",text:{nl:"Wat ga jij vandaag delen?",fr:"Et toi, que vas-tu partager aujourd’hui ?",ar:"وأنت، ماذا ستشارك اليوم؟"}}]},{id:"wachten-op-iftar",title:{nl:"Qamar en het wachten op iftar",fr:"Qamar et l’attente de l’iftar",ar:"قمر وانتظار الإفطار"},cover:"sunset",reviewed:!1,free:!0,pages:[{scene:"ramadanWindow",text:{nl:"Het is Ramadan. Adam oefent vandaag om te vasten tot de middag. Qamar kijkt mee vanuit de hemel.",fr:"C’est le Ramadan. Adam s’entraîne aujourd’hui à jeûner jusqu’à midi. Qamar le regarde depuis le ciel.",ar:"إنه رمضان. يتدرّب آدم اليوم على الصيام حتى الظهر، وقمر يراقبه من السماء."}},{scene:"waiting",text:{nl:"Adams buik rommelt. Hij kijkt naar de dadels op tafel. Wachten is moeilijk!",fr:"Le ventre d’Adam gargouille. Il regarde les dattes sur la table. Attendre, c’est difficile !",ar:"بطن آدم يقرقر. ينظر إلى التمر على المائدة. الانتظار صعب!"}},{scene:"waiting",text:{nl:"Mama glimlacht. „Geduld noemen we <b>sabr</b>. Allah houdt van mensen die geduld hebben.”",fr:"Maman sourit : « La patience, on l’appelle <b>sabr</b>. Allah aime ceux qui sont patients. »",ar:"تبتسم أمّه وتقول: «الصبر جميل، <b>والله يحبّ الصابرين</b>»."}},{scene:"sharing",text:{nl:"Om het wachten korter te maken, zetten ze samen een bordje dadels klaar voor de buren.",fr:"Pour que l’attente passe plus vite, ils préparent ensemble une assiette de dattes pour les voisins.",ar:"ولكي يمرّ الوقت، يجهّزان معًا صحنًا من التمر للجيران."}},{scene:"sunset",text:{nl:"De zon gaat onder. Van ver klinkt de adhan van de moskee. Het is tijd!",fr:"Le soleil se couche. Au loin, on entend l’adhan de la mosquée. C’est l’heure !",ar:"تغرب الشمس، ويُسمع الأذان من المسجد البعيد. حان الوقت!"}},{scene:"iftar",text:{nl:"Het hele gezin zegt <b>Bismillah</b> en begint met een dadel en wat water. Adam is trots.",fr:"Toute la famille dit <b>Bismillah</b> et commence par une datte et un peu d’eau. Adam est fier.",ar:"تقول العائلة كلها <b>بسم الله</b> وتبدأ بتمرة وقليل من الماء. آدم فخور بنفسه."}},{scene:"question",text:{nl:"Waarvoor had jij vandaag geduld?",fr:"Et toi, pour quoi as-tu été patient aujourd’hui ?",ar:"وأنت، على ماذا صبرت اليوم؟"}}]},{id:"glimlach",title:{nl:"Yasmine en de glimlach",fr:"Yasmine et le sourire",ar:"ياسمين والابتسامة"},cover:"smile",reviewed:!1,free:!1,pages:[{scene:"playground",text:{nl:"Het is een zonnige dag. Qamar slaapt, want overdag schijnt de zon. Yasmine speelt in het park.",fr:"C’est une journée ensoleillée. Qamar dort, car le jour c’est le soleil qui brille. Yasmine joue au parc.",ar:"إنه يوم مشمس. قمر نائم، لأن الشمس تُشرق في النهار. ياسمين تلعب في الحديقة."}},{scene:"playground",text:{nl:"Dan ziet ze een meisje alleen op de schommel zitten. Ze kijkt verdrietig.",fr:"Puis elle voit une fille assise toute seule sur la balançoire. Elle a l’air triste.",ar:"ثم ترى بنتًا تجلس وحدها على الأرجوحة. تبدو حزينة."}},{scene:"helping",text:{nl:"Yasmine gaat naast haar zitten. „Wil je samen spelen?” vraagt ze vriendelijk.",fr:"Yasmine s’assoit à côté d’elle. « Tu veux jouer avec moi ? » demande-t-elle gentiment.",ar:"تجلس ياسمين بجانبها وتسألها بلطف: «هل تلعبين معي؟»"}},{scene:"smile",text:{nl:"Het meisje lacht. Yasmine weet: een glimlach naar een ander is ook <b>sadaqa</b>.",fr:"La fille sourit. Yasmine le sait : sourire à quelqu’un, c’est aussi une <b>sadaqa</b>.",ar:"تبتسم البنت. وياسمين تعرف أنّ الابتسامة في وجه الآخرين <b>صدقة</b>."}},{scene:"question",text:{nl:"Naar wie ga jij vandaag lachen?",fr:"Et toi, à qui vas-tu sourire aujourd’hui ?",ar:"وأنت، لمن ستبتسم اليوم؟"}}]},{id:"vijf-gebeden",title:{nl:"Adam en de vijf gebeden",fr:"Adam et les cinq prières",ar:"آدم والصلوات الخمس"},cover:"maghrib",reviewed:!1,free:!1,pages:[{scene:"fajr",text:{nl:"Het is nog vroeg. De lucht wordt een beetje licht. Papa roept zacht: „Adam, het is tijd voor <b>Fajr</b>.”",fr:"Il est encore tôt. Le ciel s’éclaire un peu. Papa appelle doucement : « Adam, c’est l’heure de <b>Fajr</b>. »",ar:"ما زال الوقت مبكرًا، والسماء تضيء قليلًا. يناديه أبوه بهدوء: «يا آدم، حان وقت <b>الفجر</b>»."}},{scene:"dhuhr",text:{nl:"Rond de middag staat de zon hoog aan de hemel. Dan bidden ze <b>Dhuhr</b>.",fr:"Vers midi, le soleil est haut dans le ciel. C’est l’heure de <b>Dhuhr</b>.",ar:"عند الظهيرة تكون الشمس عالية في السماء. فيصلّون <b>الظهر</b>."}},{scene:"asr",text:{nl:"In de namiddag worden de schaduwen langer. Adam stopt even met spelen voor <b>Asr</b>.",fr:"L’après-midi, les ombres s’allongent. Adam arrête de jouer un moment pour <b>Asr</b>.",ar:"بعد الظهر تطول الظلال. يتوقف آدم عن اللعب قليلًا لصلاة <b>العصر</b>."}},{scene:"maghrib",text:{nl:"De zon gaat onder en de lucht kleurt oranje. Nu is het tijd voor <b>Maghrib</b>.",fr:"Le soleil se couche et le ciel devient orange. C’est l’heure de <b>Maghrib</b>.",ar:"تغرب الشمس وتصبح السماء برتقالية. الآن وقت <b>المغرب</b>."}},{scene:"isha",text:{nl:"Als het helemaal donker is en Qamar straalt, bidden ze <b>Isha</b>. Vijf gebeden op één dag!",fr:"Quand il fait tout noir et que Qamar brille, ils prient <b>Isha</b>. Cinq prières en une journée !",ar:"وعندما يحلّ الظلام ويتلألأ قمر، يصلّون <b>العشاء</b>. خمس صلوات في يوم واحد!"}},{scene:"question",text:{nl:"Welk gebed komt bij zonsondergang?",fr:"Quelle prière vient au coucher du soleil ?",ar:"أيّ صلاة تكون عند غروب الشمس؟"}}]},{id:"sorry",title:{nl:"Yasmine zegt sorry",fr:"Yasmine demande pardon",ar:"ياسمين تعتذر"},cover:"sorry",reviewed:!1,free:!1,pages:[{scene:"tower",text:{nl:"Yasmines broertje Bilal bouwt een hoge toren met blokken. Hij is er heel trots op.",fr:"Bilal, le petit frère de Yasmine, construit une haute tour en cubes. Il en est très fier.",ar:"يبني بلال، أخو ياسمين الصغير، برجًا عاليًا من المكعبات. وهو فخور به جدًا."}},{scene:"towerFallen",text:{nl:"Yasmine rent voorbij en boem! De toren valt om. Bilal begint te huilen.",fr:"Yasmine passe en courant et boum ! La tour tombe. Bilal se met à pleurer.",ar:"تركض ياسمين بجانبه، وبوم! يسقط البرج. يبدأ بلال بالبكاء."}},{scene:"towerFallen",text:{nl:"Yasmine voelt zich niet fijn. Ze gaat naast Bilal zitten en zegt: „Het spijt me. Dat was niet de bedoeling.”",fr:"Yasmine se sent mal. Elle s’assoit près de Bilal et dit : « Pardon. Je ne l’ai pas fait exprès. »",ar:"تشعر ياسمين بالحزن. تجلس بجانب بلال وتقول: «أنا آسفة، لم أقصد ذلك»."}},{scene:"sorry",text:{nl:"Bilal veegt zijn tranen weg. „Ik vergeef je.” Samen bouwen ze een nog hogere toren.",fr:"Bilal essuie ses larmes. « Je te pardonne. » Ensemble, ils construisent une tour encore plus haute.",ar:"يمسح بلال دموعه ويقول: «سامحتك». ويبنيان معًا برجًا أعلى من قبل."}},{scene:"question",text:{nl:"Wanneer zei jij voor het laatst sorry?",fr:"Et toi, quand as-tu demandé pardon pour la dernière fois ?",ar:"وأنت، متى اعتذرت آخر مرة؟"}}]},{id:"zieke-buurvrouw",title:{nl:"Soep voor de buurvrouw",fr:"Une soupe pour la voisine",ar:"حساء للجارة"},cover:"soupPot",reviewed:!1,free:!1,pages:[{scene:"rainWindow",text:{nl:"Het regent. Adam hoort dat de oude buurvrouw ziek is. Ze is helemaal alleen thuis.",fr:"Il pleut. Adam apprend que la vieille voisine est malade. Elle est toute seule chez elle.",ar:"إنها تمطر. يسمع آدم أن الجارة العجوز مريضة، وهي وحدها في البيت."}},{scene:"soupPot",text:{nl:"Samen met mama maakt Adam warme soep. Hij roert heel voorzichtig.",fr:"Avec maman, Adam prépare une soupe chaude. Il remue tout doucement.",ar:"يحضّر آدم مع أمّه حساءً ساخنًا، ويحرّكه بحذر شديد."}},{scene:"door",text:{nl:"Klop, klop. De buurvrouw doet open en kijkt verbaasd. „Is dat voor mij?”",fr:"Toc, toc. La voisine ouvre et a l’air surprise : « C’est pour moi ? »",ar:"طق، طق. تفتح الجارة الباب وتبدو متفاجئة: «هل هذا لي؟»"}},{scene:"flowers",text:{nl:"Adam knikt. „Beterschap!” De buurvrouw glimlacht. Een zieke bezoeken is een
